name: USD Middleware CI/CD

on:
  push:
  pull_request:
    branches: [ main ] 


jobs:
  # Job 1: Build the Docker image ONCE and save it as an artifact for all jobs
  build-docker:
    name: "🔨 Build Docker Image"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: set-tag
        run: echo "IMAGE_TAG=jusync-middleware:${{ github.sha }}" >> $GITHUB_ENV
      - name: Build Docker image (fast, single build for all jobs)
        run: |
          docker build -t jusync-middleware:${{ github.sha }} .
      - name: Save Docker image as artifact (optional, for reuse)
        run: |
          docker save jusync-middleware:${{ github.sha }} | gzip > image.tar.gz
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: jusync-middleware-image
          path: image.tar.gz

  # Job 2: Static Analysis (clang-tidy)
  static-analysis:
    name: "📝 Static Analysis"
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Run clang-tidy on sources
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} bash -c \
            "find . \\( -path './external' -o -path './external/*' -o -path './build*' -o -path './bin' \\) -prune -o -type f \\( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \\) -print0 | xargs -0 clang-tidy-14 -- -I./include -std=c++17 || true"

  # Job 3: Build Verification (binary presence)
  build-check:
    name: "🔍 Build & Artifact Check"
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Verify build artifacts
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} ls -la /workspace/build_test/
          docker run --rm jusync-middleware:${{ github.sha }} test -f /workspace/build_test/usd_validation_tool
          docker run --rm jusync-middleware:${{ github.sha }} test -f /workspace/build_test/libanari_usd_middleware.so

  # Job 4: All validation/test jobs use the same built image
  usd-basic-tests:
    name: "📦 USD Basic Processing"
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Test basic USD file loading
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} /workspace/build_test/usd_validation_tool --mode=usd-basic

  collision-tests:
    name: "⚔️ Collision Generation"
    runs-on: ubuntu-latest
    needs: build-check
    strategy:
      matrix:
        collision-type: [simple, complex, convex]
      fail-fast: false
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Test collision type - ${{ matrix.collision-type }}
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} /workspace/build_test/usd_validation_tool --mode=collision --type=${{ matrix.collision-type }}

  error-handling:
    name: "🔒 Error Handling"
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Test error scenarios
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} /workspace/build_test/usd_validation_tool --mode=error-handling

  performance-tests:
    name: "🚀 Performance Benchmarks"
    runs-on: ubuntu-latest
    needs: [usd-basic-tests, collision-tests]
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Run performance benchmarks
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} /workspace/build_test/usd_validation_tool --mode=performance

  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: [usd-basic-tests, collision-tests, error-handling]
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: jusync-middleware-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Run full integration suite
        run: |
          docker run --rm jusync-middleware:${{ github.sha }} /workspace/build_test/usd_validation_tool --mode=integration
