name: USD Collision Validation Tests

on: [push, pull_request]

jobs:
  test:
    name: USD Validation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.25.0  # Pin to working version

      - name: Build and run validation tests
        run: |
          COMPOSE_BAKE=false docker compose build
          docker compose up --exit-code-from jusync-middleware

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: tests/reports/
          if-no-files-found: ignore
