# Pull-only companion to docker-compose.yml.
#
# docker-compose.yml builds the image from the sibling ../ANARI-USD checkout,
# which a machine that only wants to *use* the desktop does not have. This file
# has no build section: it always pulls staticxg7/pv-anari-usd:6.0.8, which
# already contains the rebuilt ANARI-USD device and all five presets.
#
#   docker compose -f docker-compose.pull.yml pull
#   docker compose -f docker-compose.pull.yml up -d
#   open http://localhost:6080/vnc.html          (password: jusync)
#
# The ./:/work mount is optional at runtime - the presets live in the image,
# so an empty directory works too. It is kept so generated ParaView states and
# any data you drop next to this file are reachable from inside the container.
services:
  pv-desktop:
    image: staticxg7/pv-anari-usd:6.0.8
    pull_policy: missing
    container_name: pv-desktop
    ports:
      - "127.0.0.1:6080:6080" # noVNC -> http://localhost:6080/vnc.html
      - "127.0.0.1:5556:5556" # JUSYNC broker (Unreal connects here)
    volumes:
      - ./:/work
    environment:
      - JUSYNC_VNC_PASSWORD=jusync
      # Same desktop defaults as docker-compose.yml: never autostart or
      # respawn ParaView, so a crash is visible instead of hidden.
      - JUSYNC_AUTOSTART_PV=0
      - JUSYNC_PV_AUTORESTART=0
    restart: "no"
    networks:
      - jusync-network

networks:
  jusync-network:
    driver: bridge
