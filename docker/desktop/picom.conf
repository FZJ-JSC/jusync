# Keep the compositor on xrender: the container renders through llvmpipe,
# an xrender session costs nothing extra and still gives shadows + fading.
backend = "xrender";
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [ "class_g = 'tint2'", "class_g = 'xterm' && !focused" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# ParaView repaints a large GL area; blur would serialise those frames.
blur-background = false;

focus-exclude = [ "class_g = 'tint2'" ];
